<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出血線示意工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0EFEB;--sur:#fff;--b0:rgba(0,0,0,.08);--b1:rgba(0,0,0,.16);--b2:rgba(0,0,0,.22);
  --t1:#1A1917;--t2:#5E5D5A;--t3:#ADACA8;
  --r:8px;--rl:13px;
}
body{font-family:'Helvetica Neue','Hiragino Sans GB','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 5rem;line-height:1.5}

/* layout */
.wrap{width:100%;max-width:900px}
.ph{margin-bottom:1.5rem}
.ph h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:3px}
.ph p{font-size:12px;color:var(--t2)}
.layout{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start}
@media(max-width:680px){.layout{grid-template-columns:1fr}}

/* panel */
.panel{background:var(--sur);border:.5px solid var(--b2);border-radius:var(--rl);overflow:hidden}
.panel-hd{padding:11px 16px;border-bottom:.5px solid var(--b0);display:flex;align-items:center;justify-content:space-between}
.panel-hd h2{font-size:13px;font-weight:600}
.panel-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}

/* upload */
.dz{border:1.5px dashed var(--b2);border-radius:var(--r);padding:1.75rem 1rem;text-align:center;cursor:pointer;transition:all .15s;background:var(--bg)}
.dz:hover,.dz.drag{background:#E8E6DF;border-color:var(--t1)}
.dz svg{display:block;margin:0 auto 8px;color:var(--t3)}
.dz p{font-size:13px;color:var(--t2);margin-bottom:3px}
.dz em{font-size:11px;color:var(--t3);font-style:normal}
#fi{display:none}
.file-chip{display:flex;align-items:center;gap:7px;background:var(--bg);border-radius:var(--r);padding:7px 10px;font-size:12px;color:var(--t2)}
.file-chip svg{flex-shrink:0;color:var(--t3)}
.file-chip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* field */
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;color:var(--t2);font-weight:500}
.field input,.field select{font-size:12px;padding:6px 8px;border:.5px solid var(--b2);border-radius:var(--r);background:var(--bg);color:var(--t1);outline:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--t1)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* section divider */
.divider{height:.5px;background:var(--b0);margin:2px 0}

/* legend */
.legend{display:flex;flex-direction:column;gap:6px}
.leg-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2)}
.leg-swatch{width:28px;height:4px;border-radius:2px;flex-shrink:0}

/* page selector */
.psel{display:flex;gap:4px;flex-wrap:wrap}
.pgb{padding:3px 9px;font-size:11px;border:.5px solid var(--b2);border-radius:20px;cursor:pointer;background:var(--bg);color:var(--t2)}
.pgb.on{background:var(--t1);color:#fff;border-color:var(--t1)}

/* download btn */
.dl-btn{width:100%;padding:8px;font-size:13px;font-weight:500;background:var(--t1);color:#fff;border:none;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s}
.dl-btn:hover{opacity:.85}
.dl-btn:disabled{opacity:.35;cursor:not-allowed}

/* canvas area */
.canvas-wrap{background:var(--sur);border:.5px solid var(--b2);border-radius:var(--rl);overflow:hidden;display:flex;flex-direction:column}
.canvas-toolbar{padding:10px 14px;border-bottom:.5px solid var(--b0);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.canvas-toolbar span{font-size:12px;color:var(--t2)}
.zoom-btn{padding:3px 10px;font-size:12px;border:.5px solid var(--b2);border-radius:20px;cursor:pointer;background:var(--bg);color:var(--t2);transition:all .12s}
.zoom-btn:hover{background:#E4E2DA;color:var(--t1)}
.canvas-stage{padding:1.5rem;display:flex;justify-content:center;align-items:flex-start;min-height:300px;overflow:auto;background:#D8D6D0}
.canvas-stage canvas{display:block;border-radius:2px}
.canvas-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;gap:8px}
.canvas-empty svg{color:var(--t3)}
.canvas-empty p{font-size:13px;color:var(--t3)}

/* spinner */
.spinner{width:22px;height:22px;border:2.5px solid var(--b2);border-top-color:var(--t1);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* info bar */
.info-bar{padding:9px 14px;border-top:.5px solid var(--b0);display:flex;gap:12px;flex-wrap:wrap;background:var(--bg)}
.ib{font-size:11px;color:var(--t2)}
.ib b{color:var(--t1);font-weight:600}

/* labels toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between}
.toggle-row label{font-size:12px;color:var(--t2)}
.sw{position:relative;width:34px;height:18px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw .track{position:absolute;inset:0;background:var(--b1);border-radius:9px;cursor:pointer;transition:background .2s}
.sw input:checked~.track{background:#1A1917}
.sw .track::after{content:'';position:absolute;left:3px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .2s}
.sw input:checked~.track::after{left:19px}

footer{margin-top:2rem;font-size:11px;color:var(--t3);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="ph">
    <h1>出血線示意工具</h1>
    <p>上傳圖片或 PDF，即時疊加出血線 / 成品裁切線 / 安全距離，並可匯出標記版</p>
  </div>

  <div class="layout">
    <!-- LEFT: controls -->
    <div style="display:flex;flex-direction:column;gap:12px">

      <!-- Upload -->
      <div class="panel">
        <div class="panel-hd"><h2>上傳檔案</h2></div>
        <div class="panel-body">
          <div class="dz" id="dz" onclick="document.getElementById('fi').click()" ondragover="ovr(event)" ondragleave="olv()" ondrop="odp(event)">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M12 12V4m0 0L9 7m3-3 3 3"/></svg>
            <p>點擊或拖曳檔案</p>
            <em>JPG · PNG · PDF</em>
          </div>
          <input type="file" id="fi" accept=".jpg,.jpeg,.png,.pdf,image/*,application/pdf">
          <div class="file-chip" id="fchip" style="display:none">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span id="fchip-name">—</span>
          </div>
          <div class="psel" id="psel" style="display:none"></div>
        </div>
      </div>

      <!-- Size settings -->
      <div class="panel">
        <div class="panel-hd"><h2>尺寸設定</h2></div>
        <div class="panel-body">
          <div>
            <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:6px">預設尺寸</div>
            <select id="preset" onchange="applyPreset()" style="font-size:12px;padding:6px 8px;border:.5px solid var(--b2);border-radius:var(--r);background:var(--bg);color:var(--t1);width:100%;outline:none">
              <option value="">— 自訂（從圖片偵測）—</option>
              <option value="90,54">名片 90×54 mm</option>
              <option value="148,100">明信片 148×100 mm</option>
              <option value="105,148">A6 105×148 mm</option>
              <option value="148,210">A5 148×210 mm</option>
              <option value="210,297">A4 210×297 mm</option>
              <option value="297,420">A3 297×420 mm</option>
              <option value="210,99">DL 信封 210×99 mm</option>
            </select>
          </div>
          <div class="field-row">
            <div class="field"><label>成品寬 (mm)</label><input type="number" id="pw" value="" placeholder="自動" min="1" oninput="draw()"></div>
            <div class="field"><label>成品高 (mm)</label><input type="number" id="ph" value="" placeholder="自動" min="1" oninput="draw()"></div>
          </div>
          <div class="divider"></div>
          <div class="field">
            <label>出血值 (mm) — 每邊</label>
            <select id="bleed" onchange="draw()">
              <option value="3">3 mm（一般印刷）</option>
              <option value="5">5 mm（精裝 / 特殊）</option>
              <option value="2">2 mm（小尺寸）</option>
              <option value="0">無出血</option>
            </select>
          </div>
          <div class="field">
            <label>安全距離 (mm) — 每邊</label>
            <select id="safe" onchange="draw()">
              <option value="3">3 mm（一般）</option>
              <option value="5">5 mm（重要內容）</option>
              <option value="0">不顯示</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Display options -->
      <div class="panel">
        <div class="panel-hd"><h2>顯示設定</h2></div>
        <div class="panel-body">
          <div class="toggle-row">
            <label>顯示出血線（紅框）</label>
            <label class="sw"><input type="checkbox" id="showBleed" checked onchange="draw()"><span class="track"></span></label>
          </div>
          <div class="toggle-row">
            <label>顯示裁切線（白虛線）</label>
            <label class="sw"><input type="checkbox" id="showCut" checked onchange="draw()"><span class="track"></span></label>
          </div>
          <div class="toggle-row">
            <label>顯示安全線（黃虛線）</label>
            <label class="sw"><input type="checkbox" id="showSafe" checked onchange="draw()"><span class="track"></span></label>
          </div>
          <div class="toggle-row">
            <label>顯示角標線</label>
            <label class="sw"><input type="checkbox" id="showCorners" checked onchange="draw()"><span class="track"></span></label>
          </div>
          <div class="toggle-row">
            <label>顯示文字標籤</label>
            <label class="sw"><input type="checkbox" id="showLabels" checked onchange="draw()"><span class="track"></span></label>
          </div>
          <div class="divider"></div>
          <!-- legend -->
          <div class="legend">
            <div class="leg-item"><div class="leg-swatch" style="background:#FF3B30"></div>出血線（Bleed）</div>
            <div class="leg-item"><div class="leg-swatch" style="background:#fff;border:1.5px dashed #fff;height:3px"></div>裁切線（Cut / Trim）</div>
            <div class="leg-item"><div class="leg-swatch" style="background:#FFD60A;height:3px;border-top:1.5px dashed #FFD60A"></div>安全線（Safe Zone）</div>
          </div>
          <div class="divider"></div>
          <button class="dl-btn" id="dlBtn" onclick="downloadPNG()" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            匯出標記版 PNG
          </button>
        </div>
      </div>
    </div>

    <!-- RIGHT: canvas -->
    <div class="canvas-wrap">
      <div class="canvas-toolbar">
        <span id="sizeLabel" style="flex:1;color:var(--t2)">尚未載入</span>
        <button class="zoom-btn" onclick="zoom(.8)">－</button>
        <span id="zoomLabel" style="font-size:12px;color:var(--t2);min-width:36px;text-align:center">100%</span>
        <button class="zoom-btn" onclick="zoom(1.25)">＋</button>
        <button class="zoom-btn" onclick="fitZoom()">適合</button>
      </div>

      <div class="canvas-stage" id="stage">
        <div class="canvas-empty" id="empty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
          <p>上傳圖片或 PDF 後<br>即時顯示出血線示意</p>
        </div>
        <canvas id="cvs" style="display:none"></canvas>
      </div>

      <div class="info-bar" id="infoBar" style="display:none">
        <span class="ib">原始尺寸：<b id="ib-orig">—</b></span>
        <span class="ib">成品裁切：<b id="ib-cut">—</b></span>
        <span class="ib">含出血：<b id="ib-bleed">—</b></span>
        <span class="ib">安全區：<b id="ib-safe">—</b></span>
      </div>
    </div>
  </div>
</div>
<footer>所有處理均在瀏覽器本機執行，檔案不會上傳至任何伺服器</footer>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const MM2PX=3.7795; // mm to px at 96dpi (for display scale reference)
let srcCanvas=null; // the source image on an offscreen canvas
let curZoom=1;
let srcWmm=0,srcHmm=0; // detected source size in mm (from PDF) or 0 if image

// ── drag drop ──
function ovr(e){e.preventDefault();document.getElementById('dz').classList.add('drag')}
function olv(){document.getElementById('dz').classList.remove('drag')}
function odp(e){e.preventDefault();olv();const f=e.dataTransfer.files[0];if(f)load(f)}
document.getElementById('fi').addEventListener('change',e=>{if(e.target.files[0])load(e.target.files[0])});

async function load(f){
  document.getElementById('fchip').style.display='flex';
  document.getElementById('fchip-name').textContent=f.name+' ('+(f.size/1024).toFixed(0)+' KB)';
  document.getElementById('psel').style.display='none';
  srcWmm=0;srcHmm=0;

  const isPDF=f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf');
  if(isPDF){
    await loadPDF(f);
  } else {
    await loadImage(f);
  }
}

async function loadImage(f){
  return new Promise(res=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        srcCanvas=document.createElement('canvas');
        srcCanvas.width=img.naturalWidth;
        srcCanvas.height=img.naturalHeight;
        srcCanvas.getContext('2d').drawImage(img,0,0);
        // try to read DPI from image — estimate mm from pixels at 96dpi if no EXIF
        srcWmm=0;srcHmm=0;
        fitZoom();
        draw();
        res();
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(f);
  });
}

let pdfPages=[];
let curPdfPage=0;

async function loadPDF(f){
  const ab=await f.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:ab}).promise;
  pdfPages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i);
    pdfPages.push(pg);
  }
  buildPdfPageSelector();
  await renderPDFPage(0);
}

function buildPdfPageSelector(){
  const sel=document.getElementById('psel');
  if(pdfPages.length<=1){sel.style.display='none';return}
  sel.style.display='flex';
  sel.innerHTML=pdfPages.map((_,i)=>`<button class="pgb${i===0?' on':''}" onclick="switchPDFPage(${i})">P${i+1}</button>`).join('');
}

async function switchPDFPage(i){
  curPdfPage=i;
  document.querySelectorAll('.pgb').forEach((b,j)=>b.classList.toggle('on',j===i));
  await renderPDFPage(i);
}

async function renderPDFPage(i){
  const pg=pdfPages[i];
  const vp=pg.getViewport({scale:1});
  srcWmm=parseFloat((vp.width*25.4/72).toFixed(2));
  srcHmm=parseFloat((vp.height*25.4/72).toFixed(2));
  // render at 2x scale for quality
  const scale=2;
  const vp2=pg.getViewport({scale});
  const c=document.createElement('canvas');
  c.width=Math.round(vp2.width);c.height=Math.round(vp2.height);
  const ctx=c.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext:ctx,viewport:vp2}).promise;
  srcCanvas=c;
  fitZoom();
  draw();
}

function applyPreset(){
  const v=document.getElementById('preset').value;
  if(!v)return;
  const[w,h]=v.split(',').map(Number);
  document.getElementById('pw').value=w;
  document.getElementById('ph').value=h;
  draw();
}

// ── ZOOM ──
function zoom(factor){
  curZoom=Math.max(.1,Math.min(4,curZoom*factor));
  draw();
}
function fitZoom(){
  if(!srcCanvas){curZoom=1;return}
  const stageW=document.getElementById('stage').clientWidth-48;
  const stageH=Math.max(300,window.innerHeight*0.6);
  curZoom=Math.min(stageW/srcCanvas.width, stageH/srcCanvas.height, 1);
  draw();
}

// ═══════════════════════════════════════
// CORE DRAW
// ═══════════════════════════════════════
function draw(){
  if(!srcCanvas)return;

  const bleedMm=parseInt(document.getElementById('bleed').value)||0;
  const safeMm =parseInt(document.getElementById('safe').value)||0;

  // Get user-defined finish size (in mm), fall back to auto-detected or pixel size
  let finWmm=parseFloat(document.getElementById('pw').value)||0;
  let finHmm=parseFloat(document.getElementById('ph').value)||0;

  // If PDF: src is already the finish+bleed canvas; use srcWmm
  // If image: the image IS the full uploaded file — user defines finish size
  const SW=srcCanvas.width, SH=srcCanvas.height;

  // px/mm of the source canvas
  // For PDF: srcWmm is set; for image: derive from user input or assume image = finish+bleed
  let pxPerMm;
  if(srcWmm>0){
    pxPerMm=SW/srcWmm; // PDF rendered at 2x, so this is already correct
    if(!finWmm) finWmm=srcWmm-bleedMm*2;
    if(!finHmm) finHmm=srcHmm-bleedMm*2;
  } else {
    // Image: user must supply finish size
    // If finish size not given, assume entire image = finish + bleed
    if(finWmm&&finHmm){
      // image is supposed to represent finish+bleed; compute pxPerMm from that
      pxPerMm=SW/(finWmm+bleedMm*2);
      // but clamp so bleed doesn't exceed image
    } else {
      // No size given: just show lines at proportional pixel positions
      pxPerMm=SW/100; // arbitrary; lines at pixel position
    }
  }

  // Pixel positions of lines
  // Whole canvas = bleed area + finish + bleed (if bleed>0 and image has bleed already)
  // OR whole canvas = finish only (user-specified, image has no bleed)
  // Strategy: the canvas edge = the outer bleed boundary
  // Finish starts at bleedMm*pxPerMm inset

  const bleedPx=bleedMm*pxPerMm;
  const safePx =safeMm*pxPerMm;

  // Display canvas
  const cvs=document.getElementById('cvs');
  cvs.width =Math.round(SW*curZoom);
  cvs.height=Math.round(SH*curZoom);
  cvs.style.display='block';
  document.getElementById('empty').style.display='none';

  const ctx=cvs.getContext('2d');
  ctx.clearRect(0,0,cvs.width,cvs.height);

  // Draw source image
  ctx.save();
  ctx.scale(curZoom,curZoom);
  ctx.drawImage(srcCanvas,0,0);

  // ── Bleed outer overlay: darken outside finish ──
  if(bleedMm>0&&document.getElementById('showBleed').checked){
    // semi-transparent grey overlay on bleed margin
    ctx.fillStyle='rgba(0,0,0,0.18)';
    // top strip
    ctx.fillRect(0,0,SW,bleedPx);
    // bottom
    ctx.fillRect(0,SH-bleedPx,SW,bleedPx);
    // left
    ctx.fillRect(0,bleedPx,bleedPx,SH-bleedPx*2);
    // right
    ctx.fillRect(SW-bleedPx,bleedPx,bleedPx,SH-bleedPx*2);
  }

  // ── Helper: draw a dashed rect ──
  function drawRect(x,y,w,h,color,lineW,dash,cap='butt'){
    ctx.save();
    ctx.strokeStyle=color;
    ctx.lineWidth=lineW;
    ctx.setLineDash(dash);
    ctx.lineCap=cap;
    ctx.strokeRect(x,y,w,h);
    ctx.restore();
  }

  // ── Corner marks (crop marks) outside finish area ──
  const cmLen=8, cmGap=3; // px at unscaled
  if(document.getElementById('showCorners').checked&&bleedMm>0){
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,0.90)';
    ctx.lineWidth=1.2/curZoom;
    ctx.setLineDash([]);
    const x=bleedPx,y=bleedPx,r=SW-bleedPx,b=SH-bleedPx;
    // TL
    ctx.beginPath();ctx.moveTo(x-cmGap,y);ctx.lineTo(x-cmGap-cmLen,y);ctx.moveTo(x,y-cmGap);ctx.lineTo(x,y-cmGap-cmLen);ctx.stroke();
    // TR
    ctx.beginPath();ctx.moveTo(r+cmGap,y);ctx.lineTo(r+cmGap+cmLen,y);ctx.moveTo(r,y-cmGap);ctx.lineTo(r,y-cmGap-cmLen);ctx.stroke();
    // BL
    ctx.beginPath();ctx.moveTo(x-cmGap,b);ctx.lineTo(x-cmGap-cmLen,b);ctx.moveTo(x,b+cmGap);ctx.lineTo(x,b+cmGap+cmLen);ctx.stroke();
    // BR
    ctx.beginPath();ctx.moveTo(r+cmGap,b);ctx.lineTo(r+cmGap+cmLen,b);ctx.moveTo(r,b+cmGap);ctx.lineTo(r,b+cmGap+cmLen);ctx.stroke();
    ctx.restore();
  }

  // ── Cut line (finish boundary) ──
  if(document.getElementById('showCut').checked&&bleedMm>0){
    drawRect(bleedPx,bleedPx,SW-bleedPx*2,SH-bleedPx*2,'rgba(255,255,255,0.95)',1.5/curZoom,[5,4]);
    // Red bleed line = canvas edge indicator
    ctx.save();ctx.strokeStyle='#FF3B30';ctx.lineWidth=2/curZoom;ctx.setLineDash([]);
    ctx.strokeRect(1/curZoom,1/curZoom,SW-2/curZoom,SH-2/curZoom);
    ctx.restore();
  } else if(document.getElementById('showBleed').checked){
    ctx.save();ctx.strokeStyle='#FF3B30';ctx.lineWidth=2/curZoom;ctx.setLineDash([]);
    ctx.strokeRect(1/curZoom,1/curZoom,SW-2/curZoom,SH-2/curZoom);
    ctx.restore();
  }

  // ── Safe line ──
  if(safeMm>0&&document.getElementById('showSafe').checked){
    const sx=bleedPx+safePx, sy=bleedPx+safePx;
    drawRect(sx,sy,SW-bleedPx*2-safePx*2,SH-bleedPx*2-safePx*2,'rgba(255,214,10,0.85)',1.2/curZoom,[4,3]);
  }

  // ── Labels ──
  if(document.getElementById('showLabels').checked){
    ctx.save();
    ctx.scale(1/curZoom,1/curZoom); // labels at fixed screen size
    const SX=SW*curZoom, SY=SH*curZoom;
    const bpx=bleedPx*curZoom, spx=safePx*curZoom;
    const fs=11;
    ctx.font=`600 ${fs}px 'Helvetica Neue',sans-serif`;
    ctx.textBaseline='middle';

    function drawLabel(text,x,y,bg,fg){
      const pad=4, tw=ctx.measureText(text).width;
      ctx.fillStyle=bg;
      ctx.beginPath();
      const rx=x-pad, ry=y-fs/2-3, rw=tw+pad*2, rh=fs+6;
      ctx.roundRect(rx,ry,rw,rh,3);
      ctx.fill();
      ctx.fillStyle=fg;
      ctx.fillText(text,x,y);
    }

    if(bleedMm>0&&document.getElementById('showBleed').checked){
      drawLabel(`出血線 ${bleedMm}mm`,6,bpx/2||14,'rgba(220,40,30,.85)','#fff');
    }
    if(bleedMm>0&&document.getElementById('showCut').checked){
      drawLabel('裁切線（成品尺寸）',bpx+6,bpx+12,'rgba(255,255,255,.85)','#333');
    }
    if(safeMm>0&&document.getElementById('showSafe').checked){
      drawLabel(`安全距離 ${safeMm}mm`,bpx+spx+6,bpx+spx+12,'rgba(200,170,0,.9)','#111');
    }
    ctx.restore();
  }

  ctx.restore(); // end scale(curZoom)

  // ── Update info bar ──
  document.getElementById('infoBar').style.display='flex';
  document.getElementById('zoomLabel').textContent=Math.round(curZoom*100)+'%';
  document.getElementById('sizeLabel').textContent=`${SW}×${SH}px`;

  const wmm=(finWmm||0).toFixed(0), hmm=(finHmm||0).toFixed(0);
  document.getElementById('ib-orig').textContent=`${SW}×${SH} px`;
  document.getElementById('ib-cut').textContent=wmm&&hmm?`${wmm}×${hmm} mm`:'—';
  document.getElementById('ib-bleed').textContent=bleedMm>0?(parseFloat(wmm)+bleedMm*2)+'×'+(parseFloat(hmm)+bleedMm*2)+' mm':'—';
  document.getElementById('ib-safe').textContent=safeMm>0?safeMm+'mm 內縮':'—';
  document.getElementById('dlBtn').disabled=false;
}

function downloadPNG(){
  const cvs=document.getElementById('cvs');
  const link=document.createElement('a');
  link.download='bleed-preview.png';
  link.href=cvs.toDataURL('image/png');
  link.click();
}

window.addEventListener('resize',()=>{if(srcCanvas)fitZoom()});
</script>
